# Base de données PostgreSQL pour travailler sur son ordinateur.
# Démarrer : docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ecole
      POSTGRES_PASSWORD: ecole
      POSTGRES_DB: ecole
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
