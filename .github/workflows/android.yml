# Fabrique l'application Android (fichier .aab à déposer sur le Play Store).
# L'application affiche le site : on ne la refait que si son nom, son icône
# ou son adresse changent. Voir mobile/README.md.
#
# Lancement manuel : onglet Actions > « Application Android » > Run workflow.
# Le fichier se télécharge ensuite en bas de la page du lancement (Artifacts).
name: Application Android

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/android/**", ".github/workflows/android.yml"]

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_VERSION: 1.27.0
      BUILD_TOOLS: 36.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Outils Android
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;$BUILD_TOOLS" "platforms;android-36" > /dev/null
          npm install -g "@bubblewrap/cli@$BUBBLEWRAP_VERSION"
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

      # La vraie clé d'envoi est gardée dans les secrets du dépôt. Sans elle
      # (par exemple sur une copie du dépôt), on signe avec une clé de test :
      # le fichier sert alors seulement à vérifier que tout se fabrique.
      - name: Clé de signature
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android.keystore
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de clé d'envoi dans les secrets : fichier de test uniquement, à ne pas déposer sur le Play Store."
            keytool -genkeypair -keystore android.keystore -alias upload -keyalg RSA -keysize 2048 \
              -validity 365 -storepass test-only -keypass test-only -dname "CN=Test"
            echo "BUBBLEWRAP_KEYSTORE_PASSWORD=test-only" >> "$GITHUB_ENV"
            echo "BUBBLEWRAP_KEY_PASSWORD=test-only" >> "$GITHUB_ENV"
          fi

      # Chaque fabrication reçoit un numéro de version plus grand que la
      # précédente, comme l'exige le Play Store.
      - name: Numéro de version
        working-directory: mobile/android
        run: |
          jq --argjson code "$((GITHUB_RUN_NUMBER + 1))" \
             '.appVersionCode = $code | .appVersionName = "1.0.\($code)"' \
             twa-manifest.json > m.json && mv m.json twa-manifest.json
          jq '{appVersionName, appVersionCode, host, packageId}' twa-manifest.json

      - name: Fabrication
        working-directory: mobile/android
        run: |
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
          ls -la *.aab *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: application-android
          path: |
            mobile/android/app-release-bundle.aab
            mobile/android/app-release-signed.apk
            mobile/android/twa-manifest.json
          retention-days: 30
