# Fabrique l'application iPhone (Capacitor). Voir mobile/README.md.
#
# - À chaque modification du dossier mobile/ios : on vérifie seulement que
#   l'application se construit (sans compte Apple).
# - Lancement manuel (Actions > « Application iPhone » > Run workflow), une fois
#   les secrets Apple ajoutés : l'application est signée et envoyée sur
#   App Store Connect (TestFlight), prête à être soumise à Apple.
name: Application iPhone

on:
  workflow_dispatch:
  pull_request:
    paths: ["mobile/ios/**", ".github/workflows/ios.yml"]

jobs:
  ios:
    # Machines Intel : les machines Apple Silicon de GitHub sont souvent saturées.
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: mobile/ios
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx cap sync ios

      - name: Vérification (sans signature)
        if: github.event_name != 'workflow_dispatch' || env.ASC_KEY == ''
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 20

      - name: Signature et envoi sur App Store Connect
        if: github.event_name == 'workflow_dispatch' && env.ASC_KEY != ''
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$ASC_KEY_ID.p8 -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" $AUTH archive | tail -n 20
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" $AUTH | tail -n 20
