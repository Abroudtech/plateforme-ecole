# Mise en ligne sur Render (hébergement géré, sans serveur à entretenir).
# Sur render.com : New > Blueprint > choisir ce dépôt. Voir docs/DEPLOIEMENT.md.
databases:
  - name: ecole-base
    databaseName: ecole
    user: ecole
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    ipAllowList: [] # accessible uniquement depuis les services Render

services:
  - type: web
    name: ecole
    runtime: docker
    dockerfilePath: ./deploy/render/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    branch: main
    healthCheckPath: /api/sante
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecole-base
          property: connectionString
      # SMS : à ajouter plus tard dans l'onglet « Environment » du service
      # (SMS_API_URL, SMS_API_TOKEN, SMS_SENDER).
